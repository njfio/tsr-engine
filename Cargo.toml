[workspace]
resolver = "2"
members = [
    "crates/tsr-domain",
    "crates/tsr-store",
    "crates/tsr-cli",
    "crates/tsr-policy",
    "crates/tsr-forecast",
    "crates/tsr-ledger",
    "crates/tsr-learn",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/njfio/tsr-engine"
authors = ["Nicholas Ferguson <me@njf.io>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
blake3 = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# RATCHET protection profiles are TOML (PRD B5); tsr-policy parses them with `toml`.
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "deny"
