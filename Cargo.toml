[workspace]
resolver = "2"
members = ["crates/tsr-domain", "crates/tsr-store", "crates/tsr-cli", "crates/tsr-policy", "crates/tsr-learn"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/njfio/tsr-engine"
authors = ["Nicholas Ferguson <me@njf.io>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is required: the default serde_json float parser is fast but not
# correctly rounded, so a f64 written to rows.jsonl and re-read differs by 1 ULP. That
# made probe_post_action report a false post-action leak and `tsr train fit` refuse.
serde_json = { version = "1", features = ["float_roundtrip"] }
blake3 = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# RATCHET protection profiles are TOML (PRD B5); tsr-policy parses them with `toml`.
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "deny"
